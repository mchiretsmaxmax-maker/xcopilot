# Роли моделей → провайдер и модель. Смена модели роли — правка одной строки `model`.
# Провайдеры: codex_cli (Codex на подписке), deepseek (OpenAI-совместимый API), jev (TypeSafe System One).
# Цены — config/pricing.toml (модель без своей строки берёт цену провайдера по умолчанию).

[roles.writer]
provider = "codex_cli"
model = "gpt-6.2-sol"
max_tokens = 4096

[roles.judge]
provider = "jev"
# при деплое закрепить точную версию из GET /v1/models
model = "jev-latest"

[roles.cheap]
provider = "deepseek"
model = "deepseek-flash"
max_tokens = 2048

# Замены при недоступности. У writer замены нет и быть не может (ТЗ 0.3).
[fallback]
judge = "cheap"
