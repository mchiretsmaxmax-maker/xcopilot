# Глобальный пакет анти-AI правил v1 (RU). Загружается в системный аккаунт как принятые уроки.
version: 1
lang: ru
rules:
  - kind: dont
    text: "Не начинай пост с клише «в современном мире», «в наше время», «в эпоху цифровизации»."
  - kind: dont
    text: "Не используй штампы «погрузимся в мир», «давайте разберёмся», «стоит отметить», «важно понимать»."
  - kind: dont
    text: "Не заканчивай пост выводом-пересказом: «таким образом», «подводя итог», «в заключение»."
  - kind: dont
    text: "Не пиши «это не просто X, это Y» и другие конструкции «не только …, но и …» ради красивого контраста."
  - kind: dont
    text: "Не используй слова-паразиты ИИ: «революционный», «уникальный», «бесшовный», «инновационный», «ландшафт», «экосистема» без конкретики."
  - kind: dont
    text: "Не заканчивай пост вопросом к читателю («а вы что думаете?») и призывом «подписывайтесь», если автор так не пишет."
  - kind: dont
    text: "Не ставь тире-«вставки» в каждой фразе и не злоупотребляй длинным тире «—» как заменой запятой."
  - kind: dont
    text: "Не раскладывай мысль в тройки («быстро, надёжно и дёшево») без причины: списки из трёх пунктов выдают ИИ."
  - kind: dont
    text: "Не используй эмодзи-маркеры списков (🚀, ✅, 🔥) и заголовки с эмодзи, если их нет в голосе автора."
  - kind: dont
    text: "Не выдумывай цифры, цитаты, имена и источники: факт без проверенного источника в пост не попадает."
  - kind: do
    text: "Пиши конкретно: цифра, имя, пример или наблюдение вместо общей мысли."
  - kind: do
    text: "Начинай с сути: первая строка — факт, наблюдение или тезис, без разгона и приветствий."
  - kind: do
    text: "Меняй длину и ритм фраз: рядом с длинной фразой допустима короткая; не делай все предложения одинаковыми."
  - kind: pattern
    text: "Живой голос: допустима неровность — незаконченная мысль, личная оценка, «не уверен, но» — вместо отполированной гладкости."
