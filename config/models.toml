# Роли моделей → провайдер и модель. Смена модели роли — правка одной строки `model`.
# Провайдеры: claude_cli (Claude Code CLI на подписке), anthropic (Claude по API),
# deepseek (OpenAI-совместимый API), jev (TypeSafe System One).
# Цены — config/pricing.toml (модель без своей строки берёт цену провайдера по умолчанию).
# С 13.11.2026 денег на Anthropic API и Jev нет: писатель — подписка, судья — DeepSeek.
# Вернуться к API: раскомментировать старые строки, закомментировать новые (docs/adr/0011-subscription-writer.md).

[roles.writer]
provider = "claude_cli"
# provider = "anthropic"  # вернуть, когда будут ключи
model = "claude-opus-5-5"
max_tokens = 4096

[roles.judge]
provider = "deepseek"
model = "deepseek-flash"
# provider = "jev"  # вернуть, когда будут ключи
# при деплое закрепить точную версию из GET /v1/models
# model = "jev-latest"

[roles.cheap]
provider = "deepseek"
model = "deepseek-flash"
max_tokens = 2048

# Замены при недоступности. У writer замены нет и быть не может (ТЗ 0.3).
# Судья на DeepSeek сам и есть дешёвая модель: замена нужна только когда судья — Jev.
[fallback]
judge = "cheap"
