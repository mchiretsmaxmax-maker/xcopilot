# Пороги ворот качества (ТЗ, этап 11, задача 6). Аккаунт переопределяет в accounts.settings["thresholds"].
[gate]
voice_match = 2.0     # шкала 0–3
ai_smell = 2.0        # шкала 0–3 (3 — читается как человек)
on_topic = 0.7        # вероятность «да»
grounded = 0.7
risky = 0.3           # выше — к владельцу
min_confidence = 0.6  # уверенность шкалы ниже — «судья не уверен»
unsure_low = 0.4      # да/нет в зоне 0.4–0.6 — «судья не уверен»
unsure_high = 0.6
max_rewrites = 2
# Строгие ворота для ответов и цитат (решение владельца 19.11.2026, ветка feat/reply-gate-strict):
# при «судья не уверен» сомнительное переписывается до показа, а не уходит владельцу как есть.
strict_formats = ["reply", "quote"]
strict_slop_confidence = 0.4  # шаблон ai_slop от судьи с такой уверенностью — уже переписать
strict_hook_max = 0.5         # зацепка (шкала 0–2): только 0 «нет зацепки» — переписать

# Длины вариантов ответов и цитат (решение владельца 19.11.2026, ветка feat/reply-lengths):
# каждый из трёх вариантов получает свою длину; вне полосы (с допуском) — переписывание.
[reply_lengths]
short_max = 70     # короткий: одна фраза, реакция (1–70)
medium_max = 140   # средний: 70–140
long_max = 220     # длинный: 140–220
tolerance = 10     # допуск вокруг границ, знаков
