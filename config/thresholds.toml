# Пороги ворот качества (ТЗ, этап 11, задача 6). Аккаунт переопределяет в accounts.settings["thresholds"].
[gate]
voice_match = 2.0     # шкала 0–3
ai_smell = 2.0        # шкала 0–3 (3 — читается как человек)
on_topic = 0.7        # вероятность «да»
grounded = 0.7
risky = 0.3           # выше — к владельцу
min_confidence = 0.6  # уверенность шкалы ниже — «судья не уверен»
unsure_low = 0.4      # да/нет в зоне 0.4–0.6 — «судья не уверен»
unsure_high = 0.6
max_rewrites = 2
