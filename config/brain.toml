# Настройки «Мозга» (ТЗ v3.1, раздел 2.4). Этап 7A читает [analysis]; остальное — этап 9A.
[priors]
eff = [1, 1]
fit = [2, 1]

[decay_half_life_days]
default = 180
platform = 90
voice = 365

[weights.source]
own_sync = 1.0
x_api = 0.8
screenshot = 0.7
manual_numbers = 0.6
owner_label = 0.4
declared = 0.3
owner_pick = 0.25

[weights.scope]
own = 2.0
same_niche = 1.0
unknown_niche = 0.8
other_niche = 0.5

[thresholds]
foreign_cap = 0.70
probation_eff_conf = 0.55
probation_min_evidence = 3
probation_min_authors = 2
voice_compat_min = 0.60
weaken_quality = 0.40
restore_quality = 0.50
archive_quality = 0.25
low_fit = 0.25
max_auto_probation_per_week = 5
probation_idle_days = 21
weakened_idle_days = 30

[analysis]
# Фоновый переразбор при новой версии промпта или словаря: потолок расхода в день, $.
reanalyze_daily_limit_usd = 0.10
