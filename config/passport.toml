# Автопересборка паспорта стиля («Чистый голос», feat/clean-voice).
# Считаются только свои посты без AI-шаблонов (детектор ai_slop) и не вошедшие в прошлую сборку.
[auto_rebuild]
min_new = 5              # столько новых чистых своих постов с прошлой сборки
min_first = 10           # паспорта ещё нет — столько чистых своих постов для первой сборки
min_interval_hours = 12  # не чаще раза в N часов (рано — задача переставляется на срок)
delay_minutes = 2        # пауза после «это моё»: пачка постов — одна пересборка
