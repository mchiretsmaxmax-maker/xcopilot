# Исходы материалов, метод 1 (ТЗ v3.1, раздел 1.3). Стартовые значения — допущение, а не
# данные: после 30 наблюдений в корзине «формат × размер автора» их заменят квантили (этап 20).
method_version = 1

[own]
min_posts = 20          # минимум своих постов формата для перцентиля
baseline_days = 90      # окно своих постов того же формата
# границы перцентиля: flop < 0.10 ≤ below < 0.35 ≤ normal < 0.65 ≤ above < 0.90 ≤ hit
percentile_cuts = [0.10, 0.35, 0.65, 0.90]

[defer]
hours = 24              # пост моложе суток исхода не получает

# Чужие посты (и свои, пока мало истории): доли от просмотров.
# Четыре границы: flop | below | normal | above | hit (нижняя граница включительно).
[thresholds]
engagement = [0.003, 0.008, 0.02, 0.04]       # (лайки + репосты + цитаты) / просмотры
replies = [0.0002, 0.0005, 0.0015, 0.004]     # ответы / просмотры
saves = [0.0002, 0.0005, 0.002, 0.005]        # закладки / просмотры
reach = [0.05, 0.15, 0.5, 2.0]                # просмотры / подписчики автора

# Автоисход по публичным цифрам поста по ссылке (сигнал public_metrics, ADR 0033).
# Оценка = (лайки + 2·ответы + 3·ретвиты) / просмотры; просмотров нет — / подписчики автора.
# Две границы: flop < первая ≤ normal < вторая ≤ hit. Нет ни просмотров, ни подписчиков,
# или посту меньше defer.hours — автоисхода нет («без цифр»).
[auto]
by_views = [0.005, 0.03]        # < 0.5% — не зашёл, ≥ 3% — залетел
by_followers = [0.002, 0.02]    # < 0.2% аудитории — не зашёл, ≥ 2% — залетел

# Надёжность исхода по источнику сигнала (= weights.source в brain.toml).
[reliability]
own_sync = 1.0
x_api = 0.8
screenshot = 0.7
manual_numbers = 0.6
owner_label = 0.4
public_metrics = 0.3   # автоисход слабее кнопки владельца (0.4)
owner_pick = 0.25
