list = ["список", "перечень пунктов одного уровня"]
before_after = ["до → после", "сравнение состояния до и после изменения"]
contrast_pair = ["контрастная пара", "два противопоставленных утверждения или поведения рядом"]
step_by_step = ["пошагово", "инструкция: шаги, которые нужно выполнить по порядку"]
observation_takeaway = ["наблюдение → вывод", "замеченное явление и вывод из него"]
qa = ["вопрос-ответ", "текст построен как вопрос и ответ на него"]
thread_hook_body_cta = ["тред: хук → тело → призыв", "тред с цепляющим началом, частями и призывом в конце"]

[device]
specific_number = ["конкретная цифра", "точное число вместо общего слова: $40k, 3 недели, 12 человек"]
