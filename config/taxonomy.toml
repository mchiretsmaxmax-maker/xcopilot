# ЧЕРНОВИК ОПРЕДЕЛЕНИЙ — не из ТЗ (ТЗ даёт только ключи); написан исполнителем этапа 7A,
# владелец может править. ADR 0018.
# Стартовые словари разбора (ТЗ v3.1, раздел 2.1). Ключи засеяны миграцией 0005 в системный
# аккаунт global; этот файл даёт названия и определения (этап 7A, `brain.taxonomy.load_seed`).
# Определение — то, по чему модель и человек отличают значение от соседних.
# Правка определения не меняет версию таксономии; новый ключ — только через предложение и
# подтверждение (версия +1).

[hook_type]
number_personal = ["личная цифра", "первая строка — конкретная цифра из опыта автора: свои деньги, сроки, результат"]
number_fact = ["цифра-факт", "первая строка — статистика или факт с числом, не про самого автора"]
contrarian = ["против течения", "первая строка спорит с распространённым мнением или советом"]
question = ["вопрос", "первая строка — вопрос к читателю или риторический вопрос"]
story_open = ["начало истории", "первая строка открывает сцену или событие: время, место, что случилось"]
confession = ["признание", "автор признаётся в ошибке, слабости или неудобной правде"]
bold_claim = ["смелое заявление", "категоричное утверждение или прогноз без оговорок"]
how_to = ["как сделать", "обещание показать способ: «как я…», «как сделать…»"]
list_promise = ["обещание списка", "анонс перечня: «7 инструментов», «5 ошибок», тред-список"]
curiosity_gap = ["разрыв любопытства", "намёк на важное без раскрытия, чтобы читатель захотел узнать"]
